name: build-K2P-Ubuntu24

on: 
  #push:
   # branches:
   # - "*"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04  # 升级到最新的 Ubuntu 版本以获得更新的 GLIBC
    strategy:
      matrix:
        target: [K2P]
        toolchain: [mipsel-linux-musl]
    steps:
      - uses: actions/checkout@v4  # 升级到最新版本
        with:
          ref: dev
      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ matrix.target }}-${{ matrix.toolchain }}
      - uses: actions/setup-go@v5  # 升级到最新版本
        with:
          go-version: '1.23.0'
          check-latest: true
          cache: false
      - uses: actions/setup-node@v4  # 升级到最新版本
        with:
          node-version: 20
          check-latest: true
      - name: Debug system info
        run: |
          echo "System info:"
          uname -a
          ldd --version
          echo "Available GLIBC versions:"
          find /lib* /usr/lib* -name "libc.so.*" 2>/dev/null | head -10
          echo "GCC version:"
          gcc --version
      - name: Prepare
        run: |
          sudo apt update
          sudo apt install libtool-bin gperf python3-docutils autopoint gettext ccache build-essential \
            liblzma-dev zlib1g-dev libssl-dev libncurses5-dev libncursesw5-dev \
            flex bison pkg-config texinfo xz-utils curl wget unzip rsync bc gawk cpio
      - name: Verify dependencies
        run: |
          echo "Checking for required headers and libraries..."
          pkg-config --exists liblzma && echo "liblzma: OK" || echo "liblzma: MISSING"
          pkg-config --exists zlib && echo "zlib: OK" || echo "zlib: MISSING"
          pkg-config --exists openssl && echo "openssl: OK" || echo "openssl: MISSING"
          find /usr/include -name "lzma.h" 2>/dev/null | head -5
          echo "XZ tools available:"
          which xz || echo "xz not found"
          which lzma || echo "lzma not found"
      - name: Clean workspace and rebuild toolchain
        run: |
          echo "Cleaning workspace..."
          make clean || true
          rm -rf trunk/build/* || true
          rm -rf toolchain/toolchain-mipsel || true
          echo "Rebuilding toolchain for current system..."
          make -C toolchain clean || true
          make -C toolchain download CT_TARGET=${{ matrix.toolchain }}
      - name: Verify toolchain
        run: |
          echo "Checking if toolchain is properly built..."
          if [ -d "toolchain/toolchain-mipsel" ]; then
            echo "Toolchain directory exists"
            ls -la toolchain/toolchain-mipsel/bin/ | head -10
            echo "Testing cross-compiler..."
            if [ -f "toolchain/toolchain-mipsel/bin/mipsel-linux-musl-gcc" ]; then
              echo "Cross-compiler found, testing..."
              echo 'int main(){return 0;}' | toolchain/toolchain-mipsel/bin/mipsel-linux-musl-gcc -x c - -o /tmp/test || echo "Cross-compiler test failed"
            else
              echo "Cross-compiler not found!"
              exit 1
            fi
          else
            echo "Toolchain directory not found!"
            exit 1
          fi
      - name: Download and prepare sources
        run: |
          echo "Downloading all required sources..."
          make download || true
          echo "Checking critical source packages..."
          if [ ! -d "trunk/build/ipset-7.11" ] || [ ! -f "trunk/build/ipset-7.11/Makefile" ]; then
            echo "ipset source not properly prepared, attempting to fix..."
            rm -rf trunk/build/ipset-* || true
            make -C trunk/user/ipset download || true
            make -C trunk/user/ipset prepare || true
          fi
          echo "Listing build directory contents:"
          ls -la trunk/build/ | head -20
      - name: Build
        run: |
          make ${{ matrix.target }} TOOLCHAIN=${{ matrix.toolchain }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}-${{ matrix.toolchain }}
          path: trunk/images/*.trx
